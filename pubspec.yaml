name: curebay_assist
description: CureBay Assist — Offline AI Triage for Rural Health Workers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ML inference (REAL on-device)
  onnxruntime: ^1.4.1

  # Configs / data
  yaml: ^3.1.2
  path_provider: ^2.1.4

  # PDF generation for downloadable patient summary
  pdf: ^3.10.8
  printing: ^5.13.4

  # File handling
  share_plus: 13.0.0
  permission_handler: ^11.3.1
  intl: ^0.19.0

  # Image picker for camera mock
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/configs/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
