name: curebay_assist
description: CureBay Assist — Offline AI Triage for Rural Health Workers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  onnxruntime: ^1.4.1
  tflite_flutter: ^0.11.0
  vosk_flutter: ^0.3.46
  image_picker: ^1.1.2
  image: ^4.3.0
  yaml: ^3.1.2
  path_provider: ^2.1.4
  pdf: ^3.10.8
  printing: ^5.13.4
  share_plus: 10.0.2
  permission_handler: ^10.4.5
  intl: ^0.19.0

dependency_overrides:
  permission_handler: ^11.3.1
  permission_handler_android: ^12.0.0
  share_plus: 10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/configs/
    - assets/vosk/vosk-model-small-hi-0.22/
    - assets/vosk/vosk-model-small-hi-0.22/am/
    - assets/vosk/vosk-model-small-hi-0.22/conf/
    - assets/vosk/vosk-model-small-hi-0.22/graph/
    - assets/vosk/vosk-model-small-hi-0.22/graph/phones/
    - assets/vosk/vosk-model-small-hi-0.22/ivector/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
